name: Deploy to Google Cloud Run

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: smogassistant
  REGION: us-central1
  GAR_REPO: smogassistant-repo

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    if: ${{ secrets.GCP_SA_KEY != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Authenticate with Google Cloud
      - name: Google Cloud Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 2. Set up Google Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # 3. Configure Docker authentication for Artifact Registry
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # 4. Build and Push Container Image to Artifact Registry
      - name: Build and Push Container Image
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          LATEST_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:latest"
          
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" .
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"

      # 5. Deploy Container to Google Cloud Run
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: |
            --port=8080
            --allow-unauthenticated
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=10
            --set-env-vars=NODE_ENV=production,NEXT_TELEMETRY_DISABLED=1
          env_vars: |
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            WAQI_API_TOKEN=${{ secrets.WAQI_API_TOKEN }}

      # 6. Output Live Service URL
      - name: Show Live Service URL
        run: |
          echo "🎉 Successfully deployed SmogAssistant to Google Cloud Run!"
          echo "🌐 URL: ${{ steps.deploy.outputs.url }}"
